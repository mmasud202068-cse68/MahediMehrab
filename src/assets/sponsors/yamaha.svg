<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none">
  <defs>
    <!-- Yamaha Red Gradient -->
    <radialGradient id="yamahaRed" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#FF3333"/>
      <stop offset="65%" stop-color="#E60012"/>
      <stop offset="100%" stop-color="#B8000E"/>
    </radialGradient>
    <linearGradient id="chromeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="45%" stop-color="#94A3B8"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <!-- Tuning Fork Emblem (Left) -->
  <g transform="translate(60, 60)">
    <!-- Outer silver rim -->
    <circle r="48" fill="url(#chromeRing)" />
    <!-- Inner red face -->
    <circle r="43" fill="url(#yamahaRed)" />
    <circle r="43" stroke="#88000A" stroke-width="1.5" fill="none"/>

    <!-- Three crossed tuning forks in white/silver -->
    <g fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.8">
      <!-- Fork 1 (Vertical pointing up) -->
      <g>
        <path d="M-4,18 L-4,-15 L-9,-22 L-9,-36 L-4,-32 L-4,-24 L4,-24 L4,-32 L9,-36 L9,-22 L4,-15 L4,18 Z" />
        <polygon points="0,-40 -5,-30 5,-30" fill="#F8FAFC"/>
        <circle cx="0" cy="20" r="3" fill="#F8FAFC"/>
      </g>
      <!-- Fork 2 (Rotated 120 deg) -->
      <g transform="rotate(120)">
        <path d="M-4,18 L-4,-15 L-9,-22 L-9,-36 L-4,-32 L-4,-24 L4,-24 L4,-32 L9,-36 L9,-22 L4,-15 L4,18 Z" />
        <polygon points="0,-40 -5,-30 5,-30" fill="#F8FAFC"/>
        <circle cx="0" cy="20" r="3" fill="#F8FAFC"/>
      </g>
      <!-- Fork 3 (Rotated 240 deg) -->
      <g transform="rotate(240)">
        <path d="M-4,18 L-4,-15 L-9,-22 L-9,-36 L-4,-32 L-4,-24 L4,-24 L4,-32 L9,-36 L9,-22 L4,-15 L4,18 Z" />
        <polygon points="0,-40 -5,-30 5,-30" fill="#F8FAFC"/>
        <circle cx="0" cy="20" r="3" fill="#F8FAFC"/>
      </g>
      <!-- Center ring & core -->
      <circle cx="0" cy="0" r="7" fill="url(#yamahaRed)" stroke="#FFFFFF" stroke-width="2.5"/>
    </g>
  </g>

  <!-- YAMAHA Bold Typography (Right) in Yamaha Red #E60012 -->
  <text x="130" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#E60012" letter-spacing="3">
    YAMAHA
  </text>
</svg>
