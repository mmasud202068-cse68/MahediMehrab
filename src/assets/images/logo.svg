<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <!-- Core Brand Gradients -->
    <linearGradient id="mkGradTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="mkGradNeon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="40%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="mkGradAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="mkHexBg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="mkGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Tech Halo -->
  <polygon
    points="100,8 178,53 178,147 100,192 22,147 22,53"
    fill="url(#mkHexBg)"
    stroke="url(#mkGradNeon)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Inner Cyber Contour Hairline -->
  <polygon
    points="100,18 168,58 168,142 100,182 32,142 32,58"
    fill="none"
    stroke="url(#mkGradTeal)"
    stroke-width="1.2"
    stroke-opacity="0.45"
    stroke-dasharray="8 4"
  />

  <!-- Circuit Telemetry Nodes at Vertices -->
  <circle cx="100" cy="8" r="3.5" fill="#2dd4bf" />
  <circle cx="178" cy="53" r="3.5" fill="#14b8a6" />
  <circle cx="178" cy="147" r="3.5" fill="#059669" />
  <circle cx="100" cy="192" r="3.5" fill="#2dd4bf" />
  <circle cx="22" cy="147" r="3.5" fill="#06b6d4" />
  <circle cx="22" cy="53" r="3.5" fill="#38bdf8" />

  <!-- Autonomous Robotics Core Compass / Nav Star Accent -->
  <g transform="translate(100, 48) scale(0.65)">
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="url(#mkGradAccent)" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- Dynamic Geometric "MK" Monogram (Mehrab Khan) -->
  <!-- "M" Pillar Left -->
  <path
    d="M 52,148 L 52,66 L 70,66 L 70,148 Z"
    fill="url(#mkGradNeon)"
  />

  <!-- "M" Central Diagonal V & Interlock into K -->
  <path
    d="M 68,66 L 100,118 L 132,66 L 148,66 L 100,142 L 54,66 Z"
    fill="url(#mkGradTeal)"
  />

  <!-- "K" Diagonal Branch Up-Right -->
  <path
    d="M 98,106 L 138,58 L 158,58 L 115,116 Z"
    fill="url(#mkGradNeon)"
  />

  <!-- "K" Diagonal Branch Down-Right -->
  <path
    d="M 112,112 L 158,148 L 136,148 L 96,122 Z"
    fill="url(#mkGradNeon)"
  />

  <!-- Bottom Championship World Star / Sub-sea Indicator -->
  <g transform="translate(100, 168) scale(0.55)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#2dd4bf" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>
</svg>
